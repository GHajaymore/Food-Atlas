#:schema node_modules/wrangler/config-schema.json
#
# Cloudflare Pages + D1, for proposals only.
#
# The catalogue is not in here and that is the point: 18,008 records that change when an
# ingest script runs belong in files, and files on a CDN have no runtime, no cold start
# and no bill. What changes when a *reader* acts — a proposal, a confirmation — is the
# only thing that needs a database, and it is the only thing in this file.
#
# ## Setup, once
#
#   npx wrangler d1 create wikifoodia          # prints the database_id below
#   npx wrangler d1 migrations apply wikifoodia --remote
#   npx wrangler pages secret put IDENTITY_SECRET
#
# The last one is not optional. With no secret every write endpoint returns 503 rather
# than falling back to an unsigned identity — see functions/api/_middleware.ts for why
# failing loudly is the only safe direction here.
#
# ## What this costs
#
# Nothing, at any scale this project will reach. D1's free plan allows 5 GB of storage,
# 5 million row reads and 100,000 row writes a day; Pages Functions allow 100,000
# requests a day. A proposal is a few hundred bytes and a confirmation less, so the
# binding constraint is requests rather than storage, and the catalogue — which is every
# byte that matters — is served as static files that do not touch a Function at all.

name = "wikifoodia"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-23"

[[d1_databases]]
binding = "DB"
database_name = "wikifoodia"
# Replace with the id printed by `wrangler d1 create`. Safe to commit — it identifies
# the database, it does not authorise anything.
database_id = "5be6df5f-705f-4f4d-805d-015550d751bc"
migrations_dir = "migrations"

# Workers AI — the only binding in this project that can cost money.
#
# Off until now, deliberately, and `functions/api/translate.ts` is built for that: with
# no `AI` binding it returns 503 and the app says no translation service is connected,
# rather than failing in a way a reader has to interpret.
#
# ## What it is for
#
# 2,222 of the 3,907 preparation summaries in the atlas are in a language other than
# English — Indonesian, Chinese, Spanish, Japanese, Korean, Hindi, 43 in all. They were
# labelled with their language in an earlier pass, which stops a reader being confused;
# this is what lets them actually be read.
#
# ## What stops it running up a bill
#
#   - Translate-on-read. Nothing is bulk-translated; a record is translated when somebody
#     opens it in a language it does not have.
#   - Cached in D1 (`0007_translations.sql`). The second reader of the same record in the
#     same language costs nothing, for ever.
#   - `DAILY_LIMIT = 500` model calls, counted in D1 rather than in memory, so it holds
#     across every request and every instance. Raise it with TRANSLATION_DAILY_LIMIT
#     without a deploy; there is no way to raise it by accident.
#
# Free allocation is per-day and this is the smallest model that can do the job — chosen
# for cost rather than capability, as translationProvider.ts says.
[ai]
binding = "AI"
